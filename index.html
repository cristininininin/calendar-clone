<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendar App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calendar-app">

        <!-- Header -->
        <header class="calendar-header">

            <div class="title-section">
                <h1>Calendar</h1>
                <p id="selectedDate">Select a date</p>
            </div>

            <button id="todayButton" class="today-button">
                Today
            </button>

        </header>


        <!-- Month Navigation -->
        <div class="month-navigation">

            <button id="previousButton" class="nav-button">
                &#10094;
            </button>

            <h2 id="monthYear"></h2>

            <button id="nextButton" class="nav-button">
                &#10095;
            </button>

        </div>


        <!-- Calendar -->
        <div class="calendar">

            <!-- Days of the Week -->
            <div class="weekdays">

                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>

            </div>

            <!-- Calendar Dates -->
            <div id="calendarDays" class="calendar-days"></div>

        </div>
    <script src="script.js"></script>

</body>
</html>
